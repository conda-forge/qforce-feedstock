schema_version: 1

context:
  name: qforce
  version: 0.6.14

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/qforce-${{ version }}.tar.gz
  sha256: 68558b2c9c5486b6ffa0ffd007dbfba93edc4787ac3b31af64a722342bd8968a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - qforce=qforce.main:run

requirements:
  host:
    - python >=3.6
    - setuptools
    - pip
  run:
    - python >=3.6
    - scipy
    - numpy
    - ase
    - matplotlib-base
    - seaborn
    - networkx
    - pulp <2.2
    - numba >=0.50
    - pycolt >=0.5.3

tests:
  - python:
      imports:
        - qforce
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
    script:
      - qforce --help

about:
  summary: "Q-Force: Quantum mechanically augmented molecular force fields"
  license: Apache-2.0
  license_file: LICENCE
  homepage: https://github.com/selimsami/qforce

extra:
  recipe-maintainers:
    - jan-janssen
